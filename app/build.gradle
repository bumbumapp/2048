apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace 'bumbumapps.a2048game'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.a2048game"
        minSdk 24
        targetSdk 36
        versionCode 18
        versionName "10.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug {
            // Google's public test IDs so debug builds never request real ads.
            resValue 'string', 'app_id', 'ca-app-pub-3940256099942544~3347511713'
            resValue 'string', 'app_banner', 'ca-app-pub-3940256099942544/9214589741'
            resValue 'string', 'interstial_id', 'ca-app-pub-3940256099942544/1033173712'
        }
        release {
            // Real AdMob IDs (AdMob app "2048").
            resValue 'string', 'app_id', 'ca-app-pub-8444865753152507~8797695181'
            resValue 'string', 'app_banner', 'ca-app-pub-8444865753152507/8998674033'
            resValue 'string', 'interstial_id', 'ca-app-pub-8444865753152507/1098318507'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    testImplementation 'junit:junit:4.13.2'
}
