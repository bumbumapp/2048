apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

// Huawei Ads (Petal) slot IDs for the AppGallery build: -PHMS_BANNER_ID=... or ads.properties.
// Until the real slots are set the hms build falls back to Huawei's public test slots.
def adsProps = new Properties()
def adsPropsFile = rootProject.file('ads.properties')
if (adsPropsFile.exists()) adsPropsFile.withInputStream { adsProps.load(it) }
def adId = { String key, String fallback -> ((project.findProperty(key) ?: adsProps.getProperty(key)) ?: fallback).toString() }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_BANNER_ID = adId('HMS_BANNER_ID', 'r1xyep2j68')
def HMS_INTERSTITIAL_ID = adId('HMS_INTERSTITIAL_ID', 's3oocyp6cp')

android {
    namespace 'bumbumapps.a2048game'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.a2048game"
        minSdk 24
        targetSdk 36
        versionCode 20
        versionName "10.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        resValues true
    }
    // play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', HMS_BANNER_ID
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
        }
    }
    buildTypes {
        debug {
            // Google's public test IDs so debug builds never request real ads.
            resValue 'string', 'app_id', 'ca-app-pub-3940256099942544~3347511713'
            resValue 'string', 'app_banner', 'ca-app-pub-3940256099942544/9214589741'
            resValue 'string', 'interstial_id', 'ca-app-pub-3940256099942544/1033173712'
        }
        release {
            // Real AdMob IDs (AdMob app "2048").
            resValue 'string', 'app_id', 'ca-app-pub-8444865753152507~8797695181'
            resValue 'string', 'app_banner', 'ca-app-pub-8444865753152507/8998674033'
            resValue 'string', 'interstial_id', 'ca-app-pub-8444865753152507/1098318507'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.preference:preference:1.2.1'
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    // Not called from code; it pulls Google ad-ID classes and needs GMS, so only the Play build ships it.
    playImplementation 'com.google.firebase:firebase-analytics'

    testImplementation 'junit:junit:4.13.2'
}
